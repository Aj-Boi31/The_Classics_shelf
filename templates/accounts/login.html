{% extends 'base.html' %}

{% block title %}Login — The Classics Shelf{% endblock %}

{% block content %}

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">

      <div class="book-card p-4">
        <h2 style="font-weight:400; margin-bottom:0.25rem;">Welcome <em style="color:#854F0B;">back.</em></h2>
        <p class="text-muted mb-4" style="font-size:0.9rem;">Login to access your favourites.</p>

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" style="font-size:0.85rem;">Username</label>
            <input type="text" name="username" class="form-control" required>
          </div>
          <div class="mb-4">
            <label class="form-label" style="font-size:0.85rem;">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          {% if form.errors %}
            <p class="text-danger" style="font-size:0.85rem;">Invalid username or password.</p>
          {% endif %}
          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>

        <p class="text-center mt-3 text-muted" style="font-size:0.85rem;">
          Don't have an account? <a href="{% url 'register' %}" style="color:#854F0B;">Register here</a>
        </p>
      </div>

    </div>
  </div>
</div>

{% endblock %}
