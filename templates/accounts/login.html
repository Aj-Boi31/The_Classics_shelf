{% extends 'base.html' %}

{% block title %}Login — The Classics Shelf{% endblock %}

{% block content %}

<div class="container mt-5 mb-5" style="min-height:65vh;">
  <div class="row justify-content-center">
    <div class="col-md-5">

      <div class="book-card p-4">
        <h2 class="form-title">Welcome <em>back.</em></h2>
        <p class="text-muted form-subtitle mb-4">Login to access your favourites.</p>

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label form-label-custom">Username</label>
            <input type="text" name="username" class="form-control form-control-custom" required>
          </div>
          <div class="mb-4">
            <label class="form-label form-label-custom">Password</label>
            <input type="password" name="password" class="form-control form-control-custom" required>
          </div>
          {% if form.errors %}
            <p class="text-danger form-error-text">Invalid username or password.</p>
          {% endif %}
          <button type="submit" class="btn btn-primary w-100 form-submit-btn">Login</button>
        </form>

        <p class="text-center mt-3 text-muted form-footer-text">
          Don't have an account? <a href="{% url 'register' %}" class="link-highlight">Register here</a>
        </p>
      </div>

    </div>
  </div>
</div>

{% endblock %}
